# Public replication config for TCGA-HNSC using generalized graphr1g pipeline
# Extends v2g base configuration with public Hugging Face repository pointer.
extends: ../v2g/base.yaml

experiment_name: hnscc_v2_e1
cancers: [HNSCC]
resources: {threads: 6, device: cuda, batch_size: 8}

data:
  processed_root: data/hf_tcga
  reference_root: data/hf_tcga/references
  output_root: outputs/v2
  hf:
    repo: HawkFranklin-Research/omics-graph-priors-tcga
    revision: PUBLIC_DATASET_REVISION
    local_dir: data/hf_tcga
    allow_patterns: ['harmonized/tcga/HNSCC/*', 'harmonized/MANIFEST.csv', 'clinical/*', 'references/*']
cloud: {probe_config: null}
